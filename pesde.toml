name = "emdomanus/pulse"
version = "0.3.0"
description = "An externally evaluable absolute-time sequence runtime for Roblox."
license = "MIT"
authors = ["emdomanus"]
repository = "https://github.com/emdomanus/pulse"
private = true

includes = [
	"pesde.toml",
	"LICENSE",
	"README.md",
	"src/**/*.luau",
]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"
